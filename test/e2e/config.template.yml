# knife-azure e2e config template.
#
# Copy to test/e2e/config.yml (git-ignored) and replace every <fill-me> value.
# QMetry step commands contain {{placeholders}}; they are resolved from the
# section matching the VM OS (linux: / windows:).
#
# Placeholder -> config key:
#   {{vm-name}}, {{vm-name-timestamp}}, {{vm-name-linux}}, {{vm-name-window}}
#                          -> vm-name-linux / vm-name-window + "-<timestamp>"
#                             (one unique VM per test case, shared by its steps)
#   {{<any other key>}}    -> same key in the section (e.g. {{vm-size}})
# Keys with an empty value are dropped from the command (with their flag).
# {{current-timestamp}} = MMddHHmmss, resolved when the run starts.

linux:
  resource-group-name: "resource-group-name"
  vm-name-linux: "knife-azure-test-vm1-{{current-timestamp}}"
  service-location: "eastus"
  image-reference-publisher: "Canonical"
  image-reference-offer: "0001-com-ubuntu-server-jammy"
  image-reference-sku: "22_04-lts"
  image-reference-version: "latest"
  vm-size: "Standard_B1s"
  connection-user: "azureuser"
  connection-password: "TestPass123!@#"
  node-ssl-verify-mode: "none"
  node-verify-api-cert: false
  confirm: true

windows:
  resource-group-name: "resource-group-name"
  vm-name-window: "knife-azure-test-{{current-timestamp}}"   # Windows VM names are max 15 chars
  service-location: "eastus"
  image-reference-publisher: "MicrosoftWindowsServer"
  image-reference-offer: "WindowsServer"
  image-reference-sku: "2022-datacenter-azure-edition"
  image-reference-version: "latest"
  vm-size: "Standard_D4s_v6"
  connection-user: "azureuser"
  connection-password: "TestPass123!@#"
  node-ssl-verify-mode: "none"
  node-verify-api-cert: false
  confirm: true
